# Render Blueprint for the EditFlow API (New > Blueprint, then pick this repo).
# The database is Neon (free tier doesn't expire); paste its JDBC URL and credentials when prompted.
services:
  - type: web
    name: editflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # jdbc:postgresql://<neon-host>/<db>?sslmode=require  (use Neon's *pooled* host)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://editflow.vercel.app (comma-separate several; no wildcard)
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DB_POOL_SIZE
        value: "5"
